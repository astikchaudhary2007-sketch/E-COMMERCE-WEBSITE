<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop all products — Loot Market</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <nav class="crumbs" id="crumbs"></nav>
    <div class="shop">
      <aside class="filters panel" id="filters" aria-label="Filters"></aside>
      <section>
        <div class="shop-top">
          <div><h1 id="shop-title">All products</h1><p id="shop-count"></p></div>
          <div class="sort">
            <button class="btn btn-sm btn-ghost filter-toggle" id="filter-open">Filters</button>
            <label for="sort">Sort by</label>
            <select id="sort">
              <option value="relevance">Featured</option>
              <option value="popular">Most popular</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="rating">Customer rating</option>
              <option value="discount">Biggest discount</option>
            </select>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="grid" id="results"></div>
        <div class="pager" id="pager"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/shop.js"></script>
</body>
</html>
